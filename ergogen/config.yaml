# One identical half PCB, used twice without flipping. Rows go bottom to top.
# COL*/ROW* are placement metadata; only P0..P4 are electrical scan nets.
meta:
  engine: 4.2.1
  version: "0.2.0"
units:
  pitch: 19.05
  # Reduced perimeter only; switch pitch, islands and beams retain their sizes.
  side_margin: 1.475
  end_margin: 2
  stagger_height: 8
points:
  key:
    spread: pitch
    padding: pitch
  zones:
    matrix:
      anchor:
        shift: [60, -120]
      columns:
        pinky:
          key.column_net: COL0
          key.scan_from: P0
          rows:
            r3.scan_to: P1
            r2.scan_to: P2
            r1.scan_to: P3
            r0.scan_to: P4
        ring:
          key.stagger: 3
          key.column_net: COL1
          key.scan_from: P1
          rows:
            r3.scan_to: P2
            r2.scan_to: P3
            r1.scan_to: P4
            r0.scan_to: P0
        middle:
          key.stagger: 5
          key.column_net: COL2
          key.scan_from: P2
          rows:
            r3.scan_to: P3
            r2.scan_to: P4
            r1.scan_to: P0
            r0.scan_to: P1
        index:
          key.stagger: -5
          key.column_net: COL3
          key.scan_from: P3
          rows:
            r3.scan_to: P4
            r2.scan_to: P0
            r1.scan_to: P1
            r0.scan_to: P2
        inner:
          key.stagger: -3
          key.column_net: COL4
          key.scan_from: P4
          rows:
            r3.scan_to: P0
            r2.scan_to: P1
            r1.scan_to: P2
            r0.scan_to: P3
      rows:
        r3:
          row_net: ROW3
        r2:
          row_net: ROW2
        r1:
          row_net: ROW1
        r0:
          row_net: ROW0
outlines:
  _base_half:
    - what: rectangle
      where:
        ref: matrix_middle_r2
        shift: [0, pitch / 2 - stagger_height / 2]
      size: [5 * pitch + 2 * side_margin, 4 * pitch + stagger_height + 2 * end_margin]
      fillet: 2
  _adapter_neck:
    - what: rectangle
      where:
        ref: matrix_middle_r3
        shift: [0, -22.67]
      size: [17.84, 15.30]
      fillet: 1.30
  adapter:
    - what: outline
      name: _adapter_neck
    - what: rectangle
      where:
        ref: matrix_middle_r3
        shift: [0, -25.90]
      size: [60, 9.80]
      fillet: 0.60
  _adapter_gap:
    - what: outline
      name: adapter
      expand: 1.60
  half:
    - what: outline
      name: _base_half
    - what: outline
      name: _adapter_gap
      operation: subtract
      fillet: 0.60
  panel:
    - what: outline
      name: half
    - what: outline
      name: adapter
    - what: rectangle
      where:
        ref: matrix_middle_r3
        shift: [-18.10, -20.20]
      size: [5, 2.20]
    - what: rectangle
      where:
        ref: matrix_middle_r3
        shift: [18.10, -20.20]
      size: [5, 2.20]
      fillet: 0.60
# One PCB output: half + adapter + tabs. Review views are extracted from it.
pcbs:
  choc5x4_panel:
    template: kicad8
    outlines:
      - outline: panel
    footprints:
      switches:
        what: choc
        where: true
        params:
          from: "{{scan_from}}"
          to: "K_{{column_net}}_{{row_net}}"
      diodes:
        what: diode_sod523
        where: true
        adjust:
          shift: [3.4, 0]
          rotate: 90
        params:
          anode: "K_{{column_net}}_{{row_net}}"
          cathode: "{{scan_to}}"
      half_interface:
        what: interface_half
        where: matrix_middle_r3
      adapter_interface:
        what: interface_adapter
        where: matrix_middle_r3
      mouse_bites:
        what: mouse_bites
        where: matrix_middle_r3
