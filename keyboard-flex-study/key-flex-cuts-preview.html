  &lt;style&gt;
    #pcb-flex-cut-study {

    }

  &lt;div class=&quot;intro&quot;&gt;
    &lt;strong&gt;Recommended topology:&lt;/strong&gt; keep a rigid pad-bearing island and suspend it from the stationary key-grid with two diagonally opposed, rounded folded beams. The black regions are the final closed routed contours. The grid, anchor flares, beams, root flares, and island are merged before those contours are generated, so reinforcement cannot leave hidden cusp corners. Straight channels are 1.2 mm nominal and every final transition has at least a 0.55 mm router radius.
  &lt;/div&gt;
